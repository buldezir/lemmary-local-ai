name: Build

# Builds releases only. A tag like v0.2.0 signs the app with Developer ID,
# notarizes it and publishes it as that tag's release, with the app's update
# feed and the Linux binary, and pushes the Linux image; running the workflow
# by hand signs and notarizes it too when the secrets are there, but only
# keeps it as a run artifact. Pushes to main and pull requests build nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for the app, such as 0.2.0-test.1, to try its updates (a tag sets its own)
        required: false
      bundle_id:
        description: Bundle ID for the app, such as eu.buldezir.lemmary-local-ai.updatetest, so that test builds keep apart from the installed one
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Lemmary Local AI
    # The same Xcode as development; the macos-26 image only has Xcode 26.
    # xcode-27 runs on Apple silicon, which the app and llama-server are for.
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        working-directory: macos
    env:
      APP: .build/release-app/LemmaryLocalAI.app
      ASSET: LemmaryLocalAI-macOS-arm64.zip
      APPCAST: LemmaryLocalAI-macOS-appcast.xml   # the app's SUFeedURL

    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      # A tag's build is signed with Developer ID and notarized, so that macOS
      # opens the download and keeps its permissions across updates; a tag
      # without the certificate fails. A run by hand signs too when it can, and
      # signs ad hoc when it can't.
      - name: Import the signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then
            if [[ $GITHUB_REF == refs/tags/v* ]]; then
              echo "::error::MACOS_CERTIFICATE_P12_BASE64 isn't set; see Releases in macos/README.md"; exit 1
            fi
            exit 0
          fi
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          echo "$CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          # The certificate's issuer, in case the runner doesn't have it.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # The app is built and uploaded before the tests run, so a test that hangs
      # or fails still leaves a downloadable build. The release job waits for
      # them, so a tag's assets are only ever published from a green suite.
      - name: Build app
        timeout-minutes: 30
        run: |
          # Tags set the app's version, and a build number for Sparkle that
          # only grows: 0.3.0-beta.2 → 30002, 0.3.0 → 30099. A run by hand
          # keeps the source's, unless started with a version.
          v=$INPUT_VERSION
          if [[ $GITHUB_REF == refs/tags/v* ]]; then v=${GITHUB_REF_NAME#v}; fi
          if [ -n "$v" ]; then
            [[ $v =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[A-Za-z]*\.?([0-9]+))? ]] || { echo "::error::Not a version: $v"; exit 1; }
            m=("${BASH_REMATCH[@]}")
            export VERSION=$v BUILD=$((m[1] * 1000000 + m[2] * 10000 + m[3] * 100 + ${m[5]:-99}))
          fi
          if [ -n "$INPUT_BUNDLE_ID" ]; then export BUNDLE_ID=$INPUT_BUNDLE_ID; fi
          # bundle.sh gives a Developer ID signature the hardened runtime and a
          # secure timestamp, which notarization wants, on every binary in the
          # app: llama-server and its dylibs, ocr-worker, and Sparkle's helpers.
          if [ -n "$SIGNING_KEYCHAIN" ]; then export IDENTITY="Developer ID Application"; fi
          ./Scripts/release.sh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUNDLE_ID: ${{ inputs.bundle_id }}

      # ditto keeps the bundle's symlinks, its signature and its stapled ticket;
      # `zip` does not, and upload-artifact would re-zip the tree without them
      # either way.
      - name: Package
        run: |
          codesign --verify --deep --strict "$APP"
          for exe in "$APP"/Contents/MacOS/*; do lipo -archs "$exe"; done
          plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist"
          if [ -n "$SIGNING_KEYCHAIN" ]; then
            for exe in "$APP"/Contents/MacOS/* "$APP"/Contents/Frameworks/*; do codesign -dvv "$exe" 2>&1 | grep -E '^(Identifier|Authority|Timestamp)='; done
            # Apple checks the app and issues a ticket, stapled to the app so
            # that its first launch needn't ask Apple.
            key=$RUNNER_TEMP/notary.p8
            echo "$NOTARY_KEY_BASE64" | base64 -d > "$key"
            notary=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
            # Submitting and waiting are separate, and retried, so that the
            # runner losing its connection for a moment doesn't fail the job.
            id=
            for attempt in 1 2 3; do
              if xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${notary[@]}" --output-format json > "$RUNNER_TEMP/notary.json" &&
                id=$(plutil -extract id raw "$RUNNER_TEMP/notary.json"); then break; fi
              cat "$RUNNER_TEMP/notary.json"; sleep 30
            done
            if [ -z "$id" ]; then echo "::error::Couldn't submit for notarization"; exit 1; fi
            echo "submission $id"
            for attempt in 1 2 3 4 5; do
              if xcrun notarytool wait "$id" "${notary[@]}" --timeout 1h --output-format json > "$RUNNER_TEMP/notary.json" &&
                status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json"); then break; fi
              cat "$RUNNER_TEMP/notary.json"; status=; sleep 30
            done
            cat "$RUNNER_TEMP/notary.json"; echo
            xcrun notarytool log "$id" "${notary[@]}" || true
            if [ "$status" != Accepted ]; then echo "::error::Notarization: ${status:-no answer}"; exit 1; fi
            xcrun stapler staple "$APP"
            spctl --assess --type execute -vv "$APP"
          fi
          mkdir dist
          ditto -c -k --keepParent "$APP" "dist/$ASSET"

          # The app's update feed. Its notes are the release's, up to its
          # Downloads; the release is usually written by the time the app is
          # built. Without the key, a run by hand makes no feed.
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            if [[ $GITHUB_REF == refs/tags/v* ]]; then echo "::error::SPARKLE_PRIVATE_KEY isn't set; see Releases in macos/README.md"; exit 1; fi
          else
            gh release view "$GITHUB_REF_NAME" --json body --jq .body 2>/dev/null | sed '/^## Downloads/,$d' > "$RUNNER_TEMP/notes.md" || true
            download="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
            Scripts/appcast.sh "$APP" "dist/$ASSET" "$download/$ASSET" \
              "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md" > "dist/$APPCAST"
            cat "dist/$APPCAST"
          fi
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
      - name: Remove the signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN"
          rm -f "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: LemmaryLocalAI-${{ github.sha }}
          path: macos/dist/
          if-no-files-found: error

      # One test at a time: some tests wait on child processes and sockets,
      # and a 3-core runner's cooperative pool has no threads to spare. The
      # suite takes seconds either way.
      - name: Test
        timeout-minutes: 15
        run: swift test --no-parallel

  # The Linux version: its binary for the release, and its image, which a tag
  # pushes to GHCR as :<version>, and as :latest unless it is a prerelease. A
  # run by hand builds both and pushes nothing. x64 only, like the llama.cpp
  # CUDA build in the image.
  linux:
    name: Lemmary Local AI for Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: linux
    env:
      ASSET: LemmaryLocalAI-linux-x64.tar.gz
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: linux/go.mod
          cache: false   # no dependencies

      # The OCR tests render pages with poppler and ImageMagick, and skip
      # without them.
      - name: Test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils imagemagick
          go vet ./...
          go test ./...

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags=-s -o lemmary-local-ai .
          mkdir dist
          tar czf "dist/$ASSET" lemmary-local-ai

      - uses: actions/upload-artifact@v7
        with:
          name: LemmaryLocalAI-linux-${{ github.sha }}
          path: linux/dist/
          if-no-files-found: error

      - name: Image tags
        id: image
        run: |
          tags=$IMAGE:test
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            v=${GITHUB_REF_NAME#v}
            tags=$IMAGE:$v
            if [[ $v != *-* ]]; then tags+=",$IMAGE:latest"; fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: linux
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the apps': the image build stores a .dockerbuild record too.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: LemmaryLocalAI-*
          merge-multiple: true
      - name: Publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: |
            **Lemmary Local AI** (`LemmaryLocalAI-macOS-arm64.zip`) needs macOS 26 on Apple silicon. It is signed with Developer ID and notarized by Apple, and updates itself: **Check for Updates…** is in its menu bar panel. Embeddings, OCR and the text model stop for a few seconds while it updates.

            Unzip it and drag `LemmaryLocalAI.app` into Applications before you open it: macOS runs an app opened where it was downloaded from a temporary copy, which can't update itself. If it says it can't be updated, quit it and run `xattr -dr com.apple.quarantine /Applications/LemmaryLocalAI.app`.

            **Lemmary Local AI for Linux** runs on an NVIDIA GPU, or without one serves the embeddings and Indra OCR on the CPU: the image `ghcr.io/buldezir/lemmary-local-ai:{version}`, or the program alone in `LemmaryLocalAI-linux-x64.tar.gz` beside llama.cpp's build. See [linux/README.md](https://github.com/buldezir/lemmary-local-ai/blob/main/linux/README.md).
        run: |
          NOTES=${NOTES//\{version\}/${TAG#v}}
          sums=$(sha256sum *) && echo "$sums" > SHA256SUMS
          # The app's update feed goes up last, so that an app that reads it
          # finds its zip.
          assets=() appcasts=()
          for f in *; do
            if [[ $f == *-appcast.xml ]]; then appcasts+=("$f"); else assets+=("$f"); fi
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            prerelease=()
            if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" --verify-tag --generate-notes --notes "$NOTES" "${prerelease[@]}" "${assets[@]}"
          fi
          if [ ${#appcasts[@]} -gt 0 ]; then gh release upload "$TAG" "${appcasts[@]}" --clobber; fi
